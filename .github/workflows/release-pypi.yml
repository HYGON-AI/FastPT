name: release-pypi

on:
  push:
    branches: [v2.12]
  workflow_dispatch:

concurrency:
  group: fastpt-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  PYTORCH_REF: 2.12.0-dev
  HIP_TORCH_PATH: ${{ github.workspace }}/pytorch-das

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
            dtk_pkg_url: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_installer_url: ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
            aicc_major: 1.0.0
          - dtk: '2610'
            image: ${{ vars.DTK2610_IMAGE_ROCKY_PY312 }}
            dtk_pkg_url: ${{ vars.DTK2610_PKG_URL }}
            aicc_installer_url: ${{ vars.AICC2610_INSTALLER_URL }}
            aicc_major: 2.0.0
    name: build-dtk${{ matrix.dtk }}
    runs-on: hygon-build
    timeout-minutes: 180
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    env:
      DTK_CHANNEL: ${{ matrix.dtk }}
      DTK_PKG_URL: ${{ matrix.dtk_pkg_url }}
      AICC_INSTALLER_URL: ${{ matrix.aicc_installer_url }}
      AICC_MAJOR: ${{ matrix.aicc_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Prepare matching DTK, AICC and nightly wheels
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          mkdir -p "${d}"
          printf '%s\n' "${GITHUB_WORKSPACE}" > "${d}/workspace.txt"
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - uses: actions/checkout@v4
        with:
          repository: HYGON-AI/pytorch-das
          ref: ${{ env.PYTORCH_REF }}
          path: pytorch-das
          fetch-depth: 1
          persist-credentials: false
      - name: Build manylinux wheel and CTest executables
        shell: bash
        run: bash build_hcu_wheel.sh
      - name: Share wheel and CTest build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/manylinux/fastpt-*.whl)
          (( ${#wheels[@]} == 1 )) || exit 1
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          cp "${wheels[0]}" "${d}/"
          tar -czf "${d}/ctest-build.tar.gz" torch-mocker/build

  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
            dtk_pkg_url: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_installer_url: ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
            aicc_major: 1.0.0
          - dtk: '2610'
            image: ${{ vars.DTK2610_IMAGE_ROCKY_PY312 }}
            dtk_pkg_url: ${{ vars.DTK2610_PKG_URL }}
            aicc_installer_url: ${{ vars.AICC2610_INSTALLER_URL }}
            aicc_major: 2.0.0
    name: test-dtk${{ matrix.dtk }}
    runs-on: hygon-bw1100-1card
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    env:
      DTK_CHANNEL: ${{ matrix.dtk }}
      DTK_PKG_URL: ${{ matrix.dtk_pkg_url }}
      AICC_INSTALLER_URL: ${{ matrix.aicc_installer_url }}
      AICC_MAJOR: ${{ matrix.aicc_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact build environment
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          test "$(cat "${d}/workspace.txt")" = "${GITHUB_WORKSPACE}"
          bash .github/scripts/setup-hcu-env.sh "${d}" restore
      - name: Restore wheel and CTest build
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          shopt -s nullglob
          wheels=("${d}"/fastpt-*.whl)
          (( ${#wheels[@]} == 1 )) || exit 1
          mkdir -p dist/manylinux
          cp "${wheels[0]}" dist/manylinux/
          tar -xzf "${d}/ctest-build.tar.gz"
      - name: Install and run CTest
        shell: bash
        run: bash .github/scripts/test-hcu-wheel.sh

  publish:
    needs: [build, test]
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
            dtk_pkg_url: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_installer_url: ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
            aicc_major: 1.0.0
          - dtk: '2610'
            image: ${{ vars.DTK2610_IMAGE_ROCKY_PY312 }}
            dtk_pkg_url: ${{ vars.DTK2610_PKG_URL }}
            aicc_installer_url: ${{ vars.AICC2610_INSTALLER_URL }}
            aicc_major: 2.0.0
    name: publish-dtk${{ matrix.dtk }}
    runs-on: hygon-build
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    env:
      DTK_CHANNEL: ${{ matrix.dtk }}
      DTK_PKG_URL: ${{ matrix.dtk_pkg_url }}
      AICC_INSTALLER_URL: ${{ matrix.aicc_installer_url }}
      AICC_MAJOR: ${{ matrix.aicc_major }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact build environment
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          bash .github/scripts/setup-hcu-env.sh "${d}" restore
      - name: Repair DAS version and upload NIGHTLY
        shell: bash
        run: |
          set -euo pipefail
          : "${PYPI_PASSWORD:?PYPI_PASSWORD secret is required}"
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          shopt -s nullglob
          wheels=("${d}"/fastpt-*.whl)
          (( ${#wheels[@]} == 1 )) || exit 1
          export ROCM_PATH=/opt/dtk
          set +u
          source /opt/dtk/env.sh
          source /opt/dtk/cuda/env.sh
          set -u
          python3 -m pip install --no-cache-dir \
            --index-url "${PYPI_URL%/}/open/deps/+simple/" ciupload
          torch_version="$(python3 -c 'import torch; print(torch.__version__.split("+")[0])')"
          CIUpload REPAIR \
            --dtk_version "${DTK_CHANNEL}" \
            --torch_version "${torch_version}" \
            --git_commit "$(git rev-parse HEAD)" \
            --outputdir output \
            -f "${wheels[0]}"
          output_wheels=(output/fastpt-*.whl)
          (( ${#output_wheels[@]} == 1 )) || exit 1
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" \
            --password "${PYPI_PASSWORD}" \
            --dtk_pkg_name "$(basename "${DTK_PKG_URL}")" \
            -f "${output_wheels[0]}" \
            --record
