name: pr-test

on:
  pull_request_target:
    branches: [v2.12]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: fastpt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  PYTORCH_REF: 2.12.0-dev
  HIP_TORCH_PATH: ${{ github.workspace }}/pytorch-das

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Pin the current PR commits
        id: check
        uses: actions/github-script@v7
        env:
          CONFIGURED: ${{ vars.PYPI_URL != '' && vars.RESOURCE_SERVER_URL != '' && vars.DTK2604_IMAGE_UBUNTU_PY310 != '' && vars.DTK2610_IMAGE_ROCKY_PY312 != '' && vars.DTK2610_PKG_URL != '' && vars.AICC2610_INSTALLER_URL != '' }}
        with:
          script: |
            const eventPr = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPr.number,
            });
            if (pr.state !== 'open' || pr.base.ref !== 'v2.12' ||
                pr.head.sha !== eventPr.head.sha) {
              core.notice('PR changed since this event; wait for the next event.');
              return;
            }
            if (process.env.CONFIGURED !== 'true') {
              core.setFailed('Required repository CI variables are missing.');
              return;
            }
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('ready', 'true');

  build:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
            dtk_pkg_url: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_installer_url: ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
            aicc_major: 1.0.0
          - dtk: '2610'
            image: ${{ vars.DTK2610_IMAGE_ROCKY_PY312 }}
            dtk_pkg_url: ${{ vars.DTK2610_PKG_URL }}
            aicc_installer_url: ${{ vars.AICC2610_INSTALLER_URL }}
            aicc_major: 2.0.0
    name: build-dtk${{ matrix.dtk }}
    runs-on: hygon-build
    timeout-minutes: 180
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    env:
      DTK_CHANNEL: ${{ matrix.dtk }}
      DTK_PKG_URL: ${{ matrix.dtk_pkg_url }}
      AICC_INSTALLER_URL: ${{ matrix.aicc_installer_url }}
      AICC_MAJOR: ${{ matrix.aicc_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.base_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Prepare matching DTK, AICC and nightly wheels
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          mkdir -p "${d}"
          printf '%s\n' "${GITHUB_WORKSPACE}" > "${d}/workspace.txt"
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - name: Merge the pinned PR commit
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ci-pr-head"
          test "$(git rev-parse refs/remotes/origin/ci-pr-head)" = "${PR_HEAD_SHA}"
          git -c user.name='FastPT CI' -c user.email='ci@users.noreply.github.com' \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"
      - uses: actions/checkout@v4
        with:
          repository: HYGON-AI/pytorch-das
          ref: ${{ env.PYTORCH_REF }}
          path: pytorch-das
          fetch-depth: 1
          persist-credentials: false
      - name: Build manylinux wheel and CTest executables
        shell: bash
        run: bash build_hcu_wheel.sh
      - name: Share wheel and CTest build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/manylinux/fastpt-*.whl)
          (( ${#wheels[@]} == 1 )) || exit 1
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          cp "${wheels[0]}" "${d}/"
          tar -czf "${d}/ctest-build.tar.gz" torch-mocker/build

  test:
    needs: [authorize, build]
    if: ${{ needs.authorize.outputs.ready == 'true' && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
            dtk_pkg_url: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_installer_url: ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
            aicc_major: 1.0.0
          - dtk: '2610'
            image: ${{ vars.DTK2610_IMAGE_ROCKY_PY312 }}
            dtk_pkg_url: ${{ vars.DTK2610_PKG_URL }}
            aicc_installer_url: ${{ vars.AICC2610_INSTALLER_URL }}
            aicc_major: 2.0.0
    name: test-dtk${{ matrix.dtk }}
    runs-on: hygon-bw1100-1card
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    env:
      DTK_CHANNEL: ${{ matrix.dtk }}
      DTK_PKG_URL: ${{ matrix.dtk_pkg_url }}
      AICC_INSTALLER_URL: ${{ matrix.aicc_installer_url }}
      AICC_MAJOR: ${{ matrix.aicc_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact build environment
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          test "$(cat "${d}/workspace.txt")" = "${GITHUB_WORKSPACE}"
          bash .github/scripts/setup-hcu-env.sh "${d}" restore
      - name: Merge the pinned PR commit
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ci-pr-head"
          test "$(git rev-parse refs/remotes/origin/ci-pr-head)" = "${PR_HEAD_SHA}"
          git -c user.name='FastPT CI' -c user.email='ci@users.noreply.github.com' \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"
      - name: Restore wheel and CTest build
        shell: bash
        run: |
          set -euo pipefail
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${DTK_CHANNEL}"
          shopt -s nullglob
          wheels=("${d}"/fastpt-*.whl)
          (( ${#wheels[@]} == 1 )) || exit 1
          mkdir -p dist/manylinux
          cp "${wheels[0]}" dist/manylinux/
          tar -xzf "${d}/ctest-build.tar.gz"
      - name: Install and run CTest
        shell: bash
        run: bash .github/scripts/test-hcu-wheel.sh
